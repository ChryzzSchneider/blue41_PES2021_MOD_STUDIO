name: Replicar Releases de Upstream

on:
  schedule:
    # Se ejecuta a las 00:00 UTC cada 3 días
    - cron: '0 0 */3 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4

      - name: Comparar versiones y replicar release
        env:
          UPSTREAM_REPO: "LimaDiogenes/blue41_PES2021_MOD_STUDIO"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          echo "Consultando el último release en upstream ($UPSTREAM_REPO)..."
          UPSTREAM_TAG=$(gh api repos/$UPSTREAM_REPO/releases/latest --jq .tag_name 2>/dev/null || echo "")

          if [ -z "$UPSTREAM_TAG" ]; then
            echo "No se encontraron releases en el repositorio upstream."
            exit 0
          fi

          echo "Último tag en upstream: $UPSTREAM_TAG"

          MY_TAG=$(gh api repos/${{ github.repository }}/releases/tags/$UPSTREAM_TAG --jq .tag_name 2>/dev/null || echo "")

          if [ "$UPSTREAM_TAG" = "$MY_TAG" ]; then
            echo "El release $UPSTREAM_TAG ya existe en este fork. Todo al día."
            exit 0
          fi

          echo "Nuevo release detectado ($UPSTREAM_TAG). Iniciando sincronización..."

          RELEASE_TITLE=$(gh api repos/$UPSTREAM_REPO/releases/latest --jq .name)
          gh api repos/$UPSTREAM_REPO/releases/latest --jq .body > release_notes.md

          if [ -z "$RELEASE_TITLE" ] || [ "$RELEASE_TITLE" = "null" ]; then
            RELEASE_TITLE="$UPSTREAM_TAG"
          fi

          mkdir -p assets
          cd assets

          echo "Descargando binarios adjuntos..."
          gh release download "$UPSTREAM_TAG" --repo "$UPSTREAM_REPO" --dir . || true

          # Comprimir carpetas en archivos .zip para evitar errores al subir directorios
          for item in *; do
            if [ -d "$item" ]; then
              echo "Comprimiendo la carpeta '$item' en un archivo .zip..."
              zip -r "${item}.zip" "$item"
              rm -rf "$item"
            fi
          done

          cd ..

          # Detectar automáticamente la rama principal del fork (main o master)
          DEFAULT_BRANCH=$(gh repo view ${{ github.repository }} --json defaultBranchRef --jq .defaultBranchRef.name)
          echo "Rama objetivo detectada: $DEFAULT_BRANCH"

          echo "Publicando release en tu fork..."
          if [ -n "$(ls -A assets 2>/dev/null)" ]; then
            gh release create "$UPSTREAM_TAG" assets/* \
              --target "$DEFAULT_BRANCH" \
              --title "$RELEASE_TITLE" \
              --notes-file release_notes.md
          else
            gh release create "$UPSTREAM_TAG" \
              --target "$DEFAULT_BRANCH" \
              --title "$RELEASE_TITLE" \
              --notes-file release_notes.md
          fi

          echo "Release $UPSTREAM_TAG replicado exitosamente con sus binarios."
